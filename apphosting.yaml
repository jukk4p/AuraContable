# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Con una sola instancia, cualquier petición lenta bloquea al resto y las
  # siguientes se rechazan con 503. Tres deja margen sin disparar el número de
  # conexiones a la base de datos (ver DATABASE_POOL_MAX en src/db/config.ts).
  maxInstances: 3
  minInstances: 0
  concurrency: 80
